name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Only build and publish when package.json carries a version that has not
      # been released yet. Without this, every push to main (a docs tweak, a
      # README fix) republishes the same version under a new tag.
      - name: Check whether this version was already released
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Tags are v{version}-{sha}, so match on the version prefix.
          ESCAPED=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          if gh release list --limit 200 --json tagName --jq '.[].tagName' \
              | grep -qE "^v${ESCAPED}(-|$)"; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "::notice::v${VERSION} is already released — skipping. Bump the version in package.json and app.json to cut a new release."
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "::notice::v${VERSION} has not been released yet — building."
          fi

  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          build-scan-publish: false

      - name: Embed build SHA
        run: |
          SHA=$(git rev-parse --short HEAD)
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.extra = { ...(app.expo.extra || {}), buildSha: '$SHA' };
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          "

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --parallel --no-configuration-cache -x lintVitalAnalyzeRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Get release tag
        id: tag
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          SHA=$(git rev-parse --short HEAD)
          echo "tag=v${VERSION}-${SHA}" >> $GITHUB_OUTPUT
          echo "title=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APKS=$(find android/app/build/outputs/apk/release -name "*.apk" | tr '\n' ' ')
          if [ -z "$APKS" ]; then echo "No APKs found!" && exit 1; fi
          gh release create "${{ steps.tag.outputs.tag }}" $APKS \
            --title "${{ steps.tag.outputs.title }}" \
            --generate-notes
